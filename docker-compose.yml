services:
  mysql:
    image: mysql:8.4
    container_name: skillonx-survey-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skillonx_survey
      MYSQL_USER: survey
      MYSQL_PASSWORD: survey
    volumes:
      - survey_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  survey_mysql_data:
